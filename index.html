<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BidoMeter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BidoMeter">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--card:#151515;--line:#2b2b2b;--ink:#efefef;--mute:#9b9b9b;--hot:#b036ad;--glow:rgba(176,54,173,.55);--red:#ff6b81}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.55);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid rgba(255,255,255,.08);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:1.3rem;flex:1 1 100%}
header form{flex:1 1 240px;display:flex;gap:6px}
input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.btn{background:var(--hot);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red)}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mute);font-weight:600}
nav button.on{background:var(--card);color:var(--hot)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.poster{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.poster img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:grid;place-items:center;background:var(--card);color:var(--mute)}
.poster div{padding:8px 10px;font-size:.9rem}
.poster small{color:var(--mute);display:block}
.score{color:var(--hot);font-weight:600}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.msg{background:var(--card);border-left:4px solid var(--hot);padding:12px 14px;border-radius:6px;margin-bottom:16px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;z-index:10;overflow:auto;padding:16px}
#modal.open{display:block}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:14px;max-width:820px;margin:0 auto;padding:20px;position:relative}
.x{position:absolute;right:12px;top:12px;background:var(--card);border:0;border-radius:50%;width:36px;height:36px}
.top{display:flex;gap:18px;flex-wrap:wrap}
.top img{width:170px;border-radius:10px;align-self:flex-start}
.top>div{flex:1 1 260px}
.meta{color:var(--mute);margin:6px 0 10px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.badge{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:.85rem}
.cast{display:flex;gap:12px;overflow-x:auto;padding:8px 0}
.cast button{background:none;border:0;width:84px;flex:none;text-align:center;font-size:.8rem}
.cast img,.cast .ph{width:72px;height:72px;border-radius:50%;margin:0 auto 4px;aspect-ratio:1}
.rate{background:var(--card);border-radius:10px;padding:14px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.stars button{background:none;border:0;font-size:1.7rem;color:#444;padding:0 2px}
.stars button.f{color:var(--hot)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lb{list-style:none;padding:0}
.lb li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.lb img,.lb .ph{width:48px;height:48px;border-radius:50%;aspect-ratio:1}
.lb b{margin-left:auto;font-family:'Bricolage Grotesque';font-size:1.4rem;color:var(--hot)}
.lb .rk{width:28px;color:var(--mute)}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
h2{margin:0 0 14px}h3{margin:20px 0 6px}

select{display:block;width:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font:inherit}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;align-items:end}
.filters label{margin:0;font-size:.8rem}
.filters input{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:800 1.6rem 'Bricolage Grotesque',system-ui,sans-serif;color:var(--hot)}
.stat span{color:var(--mute);font-size:.85rem}
.hero{position:relative;height:380px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.slide{position:absolute;inset:0;display:flex;gap:24px;align-items:flex-end;padding:28px 64px 48px;opacity:0;transition:opacity .7s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,10,.96) 0%,rgba(10,10,10,.6) 45%,rgba(10,10,10,.1) 100%)}
.slide .txt{position:relative;min-width:0}
.slide h2{font-size:2.2rem;margin:4px 0}
.slide .meta{margin:0}
.sr{color:var(--hot);letter-spacing:2px;font-size:1.2rem}
.ov{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 4px;max-width:60ch}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,10,.6);font-size:1.3rem}
.arrow.l{left:10px}.arrow.r{right:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#444;padding:0}
.dots button.on{background:var(--hot);width:26px;border-radius:6px}
@media(max-width:640px){.hero{height:440px}.slide{padding:20px 16px 44px}.slide h2{font-size:1.5rem}.arrow{display:none}}
@media(prefers-reduced-motion:reduce){.slide{transition:none}}
.score,.sr,.stars button.f,.stat b,.lb b{text-shadow:0 0 10px var(--glow)}
.dots button.on{box-shadow:0 0 10px var(--glow)}
.hero{box-shadow:0 0 24px rgba(176,54,173,.25)}
.slide .txt{text-shadow:0 1px 8px rgba(0,0,0,.7)}
.cast img,.lb img{object-fit:cover;object-position:center top;flex:none}
.lb .ph{flex:none}
.cast button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;min-height:2.5em;width:100%}
nav button{padding:8px 10px}
nav button svg{display:block;width:22px;height:22px}
.sr svg{width:1.25rem;height:1.25rem;margin-right:2px;vertical-align:-4px}
header input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
#sf{position:relative}
#sf input{padding-right:46px}
.sbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--mute)}
.sbtn:hover{color:var(--hot)}
.sbtn svg{width:20px;height:20px}
.ic{display:inline-grid;place-items:center;padding:9px 11px;justify-self:start}
.ic svg{width:20px;height:20px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-top:30px}
.strip+.top{margin-top:10px}
.strip.wide img{height:170px;aspect-ratio:16/9}
.strip img{flex:none;height:210px;aspect-ratio:2/3;object-fit:cover;border-radius:10px}
.facts{margin:8px 0 10px}
.facts p{display:flex;gap:10px;margin:3px 0}
.facts .k{flex:none;width:84px;color:var(--mute)}
.facts .v{min-width:0}
[hidden]{display:none!important}
.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.ov.clip{-webkit-line-clamp:3}
.clip.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.vm{display:block;background:none;border:0;padding:2px 0;margin:0 0 10px;color:var(--hot);font-weight:600}
.slide .txt{max-height:100%;overflow-y:auto}
img.zm{cursor:zoom-in}
.strip.wide{margin-top:16px}
.top h2{padding-right:44px}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:100vw;max-height:100vh;object-fit:contain}
.lbx,.lbp{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.4rem}
.lbx{top:14px;right:14px}
.lbp{top:50%;transform:translateY(-50%)}
.lbp.l{left:12px}.lbp.r{right:12px}
.aw .awn{margin:0 0 6px}
.aw .vm{margin:6px 0 0}
header h1{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;flex:none;color:var(--hot)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 16px}
.chip.on{background:var(--hot);border-color:var(--hot);color:#fff}
.pg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:24px 0 4px}
.pgb{min-width:38px;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.pgb.on{background:var(--hot);border-color:var(--hot);color:#fff}
.pgb:disabled{opacity:.35;cursor:default}
.gap{align-self:center;color:var(--mute)}
.bar{margin:-6px 0 8px}
.bk{background:none;border:0;color:var(--hot);font-weight:600;padding:6px 8px 6px 0}
.bar+.strip{margin-top:4px}
.hh{margin:28px 0 12px}
.hh:first-child{margin-top:0}
.atop{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding-bottom:8px}
.at{flex:none;width:140px;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.at img,.at .ph{display:block;width:140px;aspect-ratio:2/3;object-fit:cover;object-position:center top;border-radius:10px;background:var(--card)}
.at b{display:block;margin-top:6px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.at small{color:var(--mute)}
@media(max-width:480px){.stat{padding:10px}.stat b{font-size:1.3rem}}
.lbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.ftb{display:inline-flex;align-items:center;gap:8px}
.ftb svg,.vt svg{width:18px;height:18px}
.fb{background:var(--hot);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:.75rem;text-align:center}
.vt{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vt button{background:var(--card);border:0;padding:8px 12px;color:var(--mute);display:grid;place-items:center}
.vt button.on{background:var(--hot);color:#fff}
.filters{padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.lst{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lrow{display:grid;grid-template-columns:1fr 52px 62px 86px;gap:10px;align-items:center;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
button.lrow:hover{background:var(--card)}
.lrow:last-child{border-bottom:0}
.lh{color:var(--mute);font-size:.8rem;background:var(--card)}
.lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly,.lk{color:var(--mute);font-size:.9rem}
.lr{text-align:right}
@media(max-width:480px){.lrow{grid-template-columns:1fr 40px 54px 76px;gap:6px;padding:9px 8px;font-size:.92rem}}
.stat em{display:block;font-style:normal;color:var(--mute);font-size:.8rem;margin-top:2px}
.br{display:grid;grid-template-columns:minmax(70px,150px) 1fr 34px;gap:10px;align-items:center;margin:6px 0}
.br .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{display:block;background:var(--card);border-radius:6px;height:18px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--hot);border-radius:6px}
.bn{text-align:right;color:var(--mute);font-size:.9rem}
@media(max-width:480px){.br{grid-template-columns:90px 1fr 28px;gap:8px}}
.stat .tl{display:block;margin-top:8px}
.kws{margin:0 0 10px}
.kws>.meta{display:block;margin:2px 0 6px}
.chip{font:inherit;color:var(--ink)}
.chips.tabs .chip{display:grid;place-items:center;padding:8px 16px}
.chips.tabs .chip svg{width:20px;height:20px}
.kwd{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.kwd>summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:9px 12px;font-weight:600;list-style:none}
.kwd>summary::-webkit-details-marker{display:none}
.kwd>summary::after{content:'+';color:var(--hot);font-size:1.2rem;line-height:1}
.kwd[open]>summary::after{content:'–'}
.kwd .chips{padding:0 12px 12px;margin:0}
.mkw{margin-top:10px}
.kwd>.v{padding:0 12px 12px}
.lb .rk{flex:none;width:28px}
.lb li>div{flex:1;min-width:0}
.lb b{flex:none}
#modal{overscroll-behavior:contain}
.qmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 22px}
.qm{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink)}
.qm:not(:disabled):hover{border-color:var(--hot)}
.qm:disabled{opacity:.55;cursor:default}
.qm b{font:700 1.1rem 'Bricolage Grotesque',system-ui,sans-serif}
.qm span{color:var(--mute);font-size:.9rem}
.qm em{font-style:normal;color:var(--hot);font-size:.85rem;margin-top:auto;padding-top:6px}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qbar span{color:var(--mute)}
.qstage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 16px;text-align:center}
.qstage h3{margin:0}
.qposter{width:min(240px,64vw);aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--card)}
.qopts,.qhl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.qopts{grid-template-columns:1fr}}
.qo{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink)}
.qhl .qo{justify-content:center;font-weight:600}
.qo:not(:disabled):hover{border-color:var(--hot)}
.qo:disabled{cursor:default}
.qo.ok{border-color:#3ecf8e;background:rgba(62,207,142,.14)}
.qo.bad{border-color:var(--red);background:rgba(255,107,129,.14)}
.qo small{color:var(--mute)}
.qav{flex:none}
.qav img,.qav i{display:block;width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center top;background:var(--line)}
.qfb{margin:14px 0 10px;padding:10px 14px;border-radius:10px}
.qfb.ok{background:rgba(62,207,142,.14)}
.qfb.bad{background:rgba(255,107,129,.14)}
.qclues{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.qpair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}
.qc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.qc img,.qc .ph{display:block;width:100%;max-width:150px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;margin:0 auto 8px}
.qval{font:800 1.4rem 'Bricolage Grotesque',system-ui,sans-serif;color:var(--hot)}
.qhr{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.qhr:last-child{border-bottom:0}
.qend{text-align:center;padding:20px 0}
.qend .big{font:800 3.2rem 'Bricolage Grotesque',system-ui,sans-serif;color:var(--hot)}
.qwrap{overflow:hidden;border-radius:12px;line-height:0}
.qi{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;font-style:normal;color:var(--hot);background:linear-gradient(135deg,rgba(176,54,173,.42),rgba(176,54,173,.08));border:1px solid rgba(176,54,173,.5);margin-bottom:4px}
.qi svg{width:30px;height:30px}
.qm:disabled .qi{filter:grayscale(1)}
.qt{display:inline-flex;align-items:center;gap:10px}
.qi.sm{width:32px;height:32px;border-radius:9px;margin:0}
.qi.sm svg{width:18px;height:18px}
.qi.lg{width:76px;height:76px;border-radius:20px;margin:0 auto 10px}
.qi.lg svg{width:40px;height:40px}
.wnow{margin:12px 0}
.wnow>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--hot);color:#fff;font-weight:600;padding:10px 20px;border-radius:10px}
.wnow>summary::-webkit-details-marker{display:none}
.wbody{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px}
.wrow{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.wl{flex:1;min-width:0;display:block;padding:9px 8px;color:var(--ink);text-decoration:none;border-radius:8px}
.wl:hover{background:rgba(255,255,255,.05)}
.wl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl small{color:var(--mute)}
.wi{flex:none;background:none;border:0;color:var(--mute);width:38px;height:38px;border-radius:8px;display:grid;place-items:center}
.wi:hover{color:var(--hot)}
.wi svg{width:18px;height:18px}
.wbody>.btn{margin-top:10px}
.wform label{display:block;margin:10px 0 4px}
.wform code{color:var(--hot)}
.wform .acts{margin-top:10px}
.wi.wstar.on{color:var(--hot)}
.hsec{margin-top:26px}
@media(min-width:900px){
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .duo .hero{height:520px}
}
.dot{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--hot);color:#fff;font-size:.65rem;display:grid;place-items:center}
nav button{position:relative}
.uav{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,rgba(176,54,173,.5),rgba(176,54,173,.15));border:1px solid rgba(176,54,173,.5);color:#fff;font-weight:700}
.uav.lg{width:72px;height:72px;font-size:1.8rem;margin:0 auto 10px}
.ul{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.urow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.urow:last-child{border-bottom:0}
.urow:hover{background:var(--card)}
.urow .un{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.urow .go{color:var(--mute);font-size:1.3rem}
.arow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.arow:last-child{border-bottom:0}
.arow .un{flex:1;min-width:120px;font-weight:600}
.arow .un small{display:block;color:var(--mute);font-weight:400}
.abt{display:flex;gap:8px;flex-wrap:wrap}
.acc{text-align:center;padding:24px 0}

<body>
<header>
  <h1><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><mask id="pm"><rect width="64" height="64" fill="#fff"/><path d="M25 33L26.8 58M39 33L37.2 58" stroke="#000" stroke-width="2.6"/></mask>
<g fill="currentColor"><circle cx="16" cy="24" r="6.5"/><circle cx="23" cy="16" r="7.5"/><circle cx="34" cy="11" r="8"/><circle cx="44" cy="16" r="7.5"/><circle cx="48" cy="25" r="6.5"/><circle cx="32" cy="24" r="8.5"/><path mask="url(#pm)" d="M11 33h42l-5.5 25h-31z"/></g></svg>BidoMeter</h1>
  <form id="sf"><input id="q" placeholder="Search movies, series, actors…" aria-label="Search movies, series and actors"><button class="sbtn" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></form>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- config & storage ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const DEF={tmdb:'839adee8e20e6a241d50bf54b4e86116',omdb:'f994cdc4',sbUrl:'https://cnktxqtdrtztkcveuimj.supabase.co',sbKey:'sb_publishable_Z4hYMpx8Ehk87fAjAi5Gnw_L9VcmYB_'};
let cfg={...DEF,...(load('cfg')||{})};
if(!cfg.sbUrl)cfg.sbUrl=DEF.sbUrl;
if(!cfg.sbKey)cfg.sbKey=DEF.sbKey;
cfg.sbUrl=cfg.sbUrl.replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
if(!cfg.tmdb)cfg.tmdb=DEF.tmdb;
if(!cfg.omdb)cfg.omdb=DEF.omdb;
let lib=[],view='library',results=[];
let all=[],wl=[];
const isW=m=>CATS.every(([k])=>m.ratings&&m.ratings[k]);
function split(){lib=all.filter(isW);wl=all.filter(m=>!isW(m))}
const IMG='https://image.tmdb.org/t/p/';
/* Series are stored with a negative id (-tmdbId) so they never clash with movie ids; no table change needed */
const norm=r=>({id:r.media_type==='tv'?-r.id:r.id,title:r.title||r.name,release_date:r.release_date||r.first_air_date,poster_path:r.poster_path});
const CATS=[['story','Story'],['prod','Quality'],['perf','Performance'],['like','BidoMeter']];

const sbOn=()=>cfg.sbUrl&&cfg.sbKey;
/* ---------- accounts: guests, users (approved by the admin) and the admin ---------- */
let SESS=load('sess'),PROF=null,PENDING=0,RP=null;
/* Usernames become username@AUTH_DOMAIN inside Supabase Auth. No email is ever sent (keep "Confirm email" OFF in Supabase).
   Supabase only accepts domains that can receive mail (they need MX records), so a made-up domain is rejected.
   Use a domain you own if you have one. Do not change it once people have created accounts, or they will not be able to log in. */
const AUTH_DOMAIN='gmail.com';
const authEmail=u=>`${u.toLowerCase()}@${AUTH_DOMAIN}`;
const authPass=(u,pin)=>`${pin}-${u.toLowerCase()}-bidometer`;
const qzKey=()=>'quiz_'+(SESS?.user?.id||'x');
const role=()=>PROF?(PROF.approved?PROF.role:'pending'):'guest';
const canUse=()=>{const r=role();return r==='user'||r==='admin'};
const isAdmin=()=>role()==='admin';
const sbH=()=>{
  const tok=SESS?.access_token;
  return{apikey:cfg.sbKey,...(tok?{Authorization:'Bearer '+tok}:(cfg.sbKey.startsWith('eyJ')?{Authorization:'Bearer '+cfg.sbKey}:{})),'Content-Type':'application/json'};
};
function setSess(d){
  SESS={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),user:{id:d.user.id}};
  save('sess',SESS);
}
function clearSess(){SESS=null;PROF=null;try{localStorage.removeItem('sess')}catch{}}
async function authCall(path,body){
  const r=await fetch(cfg.sbUrl+'/auth/v1'+path,{method:'POST',headers:{apikey:cfg.sbKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.msg||d.error_description||d.message||`Request failed (${r.status})`);
  return d;
}
function refreshSess(){
  if(RP)return RP;
  RP=(async()=>{
    if(!SESS?.refresh_token)return false;
    try{setSess(await authCall('/token?grant_type=refresh_token',{refresh_token:SESS.refresh_token}));return true}
    catch{clearSess();return false}
  })().finally(()=>{RP=null});
  return RP;
}
async function sbf(path,o={}){
  const go=()=>fetch(cfg.sbUrl+path,{method:o.method||'GET',headers:{...sbH(),...(o.headers||{})},body:o.body});
  let r=await go();
  if(r.status===401&&SESS&&await refreshSess())r=await go();
  return r;
}
async function loadProfile(){
  PROF=null;if(!SESS)return;
  try{const r=await sbf(`/rest/v1/profiles?id=eq.${SESS.user.id}&select=*`);if(r.ok)PROF=(await r.json())[0]||null}catch{}
}
async function doSignUp(u,pin){
  let d;
  try{d=await authCall('/signup',{email:authEmail(u),password:authPass(u,pin),data:{username:u.toLowerCase()}})}
  catch(e){throw new Error(/already|registered|exists/i.test(e.message)?'That username is taken.':/rate limit/i.test(e.message)?'Supabase is trying to send a confirmation email. The admin needs to turn off “Confirm email” in Supabase (Authentication → Sign In / Providers → Email) and then try again.':e.message)}
  if(!d.access_token)throw new Error('The account was created, but Supabase still wants email confirmation. Turn off “Confirm email” in Authentication → Sign In / Providers → Email, then ask the admin to remove this account and try again.');
  setSess(d);
}
async function doSignIn(u,pin){
  try{setSess(await authCall('/token?grant_type=password',{email:authEmail(u),password:authPass(u,pin)}))}
  catch(e){throw new Error(/invalid login|credentials/i.test(e.message)?'Wrong username or PIN.':/not confirmed/i.test(e.message)?'This account was never activated. Ask the admin to remove it so you can create it again.':e.message)}
}
async function doSignOut(){
  try{await fetch(cfg.sbUrl+'/auth/v1/logout',{method:'POST',headers:sbH()})}catch{}
  clearSess();USERS=null;VU=null;VIEWU=null;await afterAuth('public');
}

/* ---------- your library (one row per user and title) ---------- */
async function dbAll(){
  if(!SESS)return[];
  const r=await sbf(`/rest/v1/movies?select=*&user_id=eq.${SESS.user.id}&order=created_at.desc`);
  if(!r.ok)throw new Error('Supabase: '+r.status);
  return r.json();
}
async function dbSave(m){
  if(!canUse())throw new Error('Your account has not been approved yet.');
  const r=await sbf('/rest/v1/movies?on_conflict=user_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({...m,user_id:SESS.user.id})});
  if(!r.ok)throw new Error('Supabase: '+r.status);
  all=await dbAll();split();
}
async function dbDel(id){
  const r=await sbf(`/rest/v1/movies?id=eq.${id}&user_id=eq.${SESS.user.id}`,{method:'DELETE'});
  if(!r.ok)throw new Error('Supabase: '+r.status);
  all=await dbAll();split();
}

/* ---------- APIs ---------- */
async function tmdb(path){
  if(!cfg.tmdb)throw new Error('TMDB API key is missing.');
  const r=await fetch('https://api.themoviedb.org/3'+path+(path.includes('?')?'&':'?')+'api_key='+cfg.tmdb);
  if(!r.ok)throw new Error('TMDB error '+r.status+'. Check your API key.');
  return r.json();
}
async function omdbData(id){
  if(!cfg.omdb||!id)return null;
  try{return await(await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${cfg.omdb}`)).json()}catch{return null}
}
async function imdbRating(id){
  if(!cfg.omdb||!id)return null;
  try{const d=await(await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${cfg.omdb}`)).json();return d.imdbRating&&d.imdbRating!=='N/A'?d.imdbRating:null}catch{return null}
}

/* ---------- views ---------- */
const IC={
 public:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 2 4.5 5"/>',
 admin:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 account:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 login:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
 dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 library:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h18M3 16h4M17 8h4M17 16h4"/>',
 watch:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 quiz:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r=".8"/><circle cx="18.5" cy="13.5" r=".8"/>',
 stats:'<path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/>',
 board:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'};
function tabs(){
  const t=[['public','Public']];
  if(canUse())t.push(['dashboard','Dashboard'],['library','Library'],['watch','To Watch'],['board','Leaderboard'],['stats','Statistics'],['quiz','Quiz'],['users','Users']);
  if(isAdmin())t.push(['admin','Admin']);
  t.push(['account',PROF?'Account':'Log in']);
  return t;
}
function nav(){
  const sv='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  document.querySelector('header').classList.toggle('few',tabs().length<=3);
  $('#nav').innerHTML=tabs().map(([k,l])=>`<button class="${view===k||(k==='users'&&view==='ulib')?'on':''}" data-v="${k}" aria-label="${l}" title="${l}"><svg ${sv}>${IC[k==='account'&&!PROF?'login':k]}</svg>${k==='admin'&&PENDING?`<span class="dot">${PENDING}</span>`:''}</button>`).join('');
}
$('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b){if(b.dataset.v==='account'&&!PROF){openAuth('in');return}view=b.dataset.v;render();window.scrollTo(0,0)}};
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;SQ={q,type:'multi',page:1,data:null};window.scrollTo(0,0);runSearch()};
function card(m){
  if(m.person)return `<button class="poster" data-a="${m.id}">${m.photo?`<img loading="lazy" src="${m.photo}" alt="">`:'<div class="ph">No photo</div>'}<div>${esc(m.title)}<small>${m.dept==='Acting'?'Actor':esc(m.dept)}</small></div></button>`;
  const w=(CSRC||all).find(x=>x.id===m.id);
  const yr=(m.year||(m.release_date||'').slice(0,4)||'');
  const poster=m.poster||(m.poster_path?IMG+'w342'+m.poster_path:'');
  const avg=w?(CRS==='imdb'?(w.imdb_rating?'IMDb '+w.imdb_rating:null):CRS==='tmdb'?(w.tmdb_rating?'TMDB '+w.tmdb_rating:null):(avgOf(w)?'★ '+avgOf(w):null)):null;
  return `<button class="poster" data-m="${m.id}">${poster?`<img loading="lazy" src="${poster}" alt="">`:`<div class="ph">No poster</div>`}
  <div>${esc(m.title)}<small>${m.st?(m.id<0?'Series':'Movie')+' · ':''}${yr}${!m.st&&m.id<0?' · Series':''}${w&&!isW(w)?' · To Watch':''}${avg?` · <span class="score">${avg}</span>`:''}</small></div></button>`;
}
const avgOf=m=>{const v=Object.values(m.ratings||{}).filter(Boolean);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null};

function wireClips(root){
  root.querySelectorAll('.clip').forEach(el=>{
    const b=el.nextElementSibling;if(!b||!b.classList.contains('vm'))return;
    if(el.scrollHeight<=el.clientHeight+1){b.hidden=true;return}
    b.onclick=()=>{const o=el.classList.toggle('open');b.textContent=o?'View less':'View more'};
  });
}
const H={};
const F0={type:'all',genre:'all',year:'all',rating:'mine',sort:'az'},F={...F0};
const num=x=>+x||0;
function heroGo(key,n){
  const box=$('#h_'+key);if(!box)return;
  const sl=box.querySelectorAll('.slide'),ds=box.querySelectorAll('.dots button'),h=H[key];
  h.i=(n+sl.length)%sl.length;
  sl.forEach((e,i)=>e.classList.toggle('on',i===h.i));ds.forEach((e,i)=>e.classList.toggle('on',i===h.i));
}
function heroBox(key,title,n,fn){
  const h=H[key]=H[key]||{i:0,t:0};h.i%=n;
  const range=Array.from({length:n},(_,i)=>i);
  return`<section class="hsec"><h2 class="hh">${title}</h2><div class="hero" id="h_${key}">${range.map(i=>fn(i,i===h.i?' on':'')).join('')}<button class="arrow l" aria-label="Previous">‹</button><button class="arrow r" aria-label="Next">›</button><div class="dots">${range.map(i=>`<button aria-label="Show slide ${i+1}" class="${i===h.i?'on':''}"></button>`).join('')}</div></div></section>`;
}
function heroWire(key,n,ms){
  const box=$('#h_'+key),h=H[key];
  const start=()=>{clearInterval(h.t);if(n>1)h.t=setInterval(()=>heroGo(key,h.i+1),ms)};
  box.querySelectorAll('.dots button').forEach((b,i)=>b.onclick=()=>{heroGo(key,i);start()});
  box.querySelector('.arrow.l').onclick=()=>{heroGo(key,h.i-1);start()};
  box.querySelector('.arrow.r').onclick=()=>{heroGo(key,h.i+1);start()};
  box.onmouseenter=()=>clearInterval(h.t);box.onmouseleave=start;start();
}
function dash(){
  const el=$('#main');
  if(!lib.length){el.innerHTML='<h2>Dashboard</h2><p class="empty">Your top rated titles will play here once you log something. Search for a movie or series above to start.</p>';return}
  const top=a=>a.filter(m=>num(avgOf(m))).sort((x,y)=>num(avgOf(y))-num(avgOf(x))||num(y.imdb_rating)-num(x.imdb_rating)).slice(0,6);
  const tm=top(lib.filter(m=>m.id>0)),ts=top(lib.filter(m=>m.id<0));
  const ac={};lib.forEach(m=>(m.cast||[]).forEach(a=>{const o=ac[a.id]??={id:a.id,name:a.name,photo:a.photo,n:0,films:[]};o.n++;o.films.push(m.title)}));
  const acts=Object.values(ac).filter(a=>a.photo).sort((x,y)=>y.n-x.n||x.name.localeCompare(y.name)).slice(0,10);
  const stat=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const SP='M12 1.7l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 17.8l-6.4 3.6L7 14.2 1.7 9.2l7.2-.9z';
  const star=(n,u)=>[0,1,2,3,4].map(i=>{const f=Math.round(Math.max(0,Math.min(1,n-i))*100);return `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g${u}_${i}"><stop offset="${f}%" style="stop-color:var(--hot)"/><stop offset="${f}%" style="stop-color:#4a4a4a"/></linearGradient></defs><path d="${SP}" fill="url(#g${u}_${i})"/></svg>`}).join('');
  const titleSlide=(key,items)=>(i,on)=>{const m=items[i],a=avgOf(m);return`<div class="slide${on}">${m.poster?`<img class="full" src="${m.poster.replace('/w342/','/w780/')}" alt="">`:''}<div class="shade"></div>
    <div class="txt"><p class="meta">#${i+1} · ${m.id<0?'Series':'Movie'} · ${m.year}</p><h2>${esc(m.title)}</h2>
    <p><span class="sr">${star(a,key+i)}</span> <span class="score">${a}</span> <span class="meta">your rating</span></p>
    <div class="badges">${m.imdb_rating?`<span class="badge">IMDb <span class="score">${m.imdb_rating}</span></span>`:''}${m.tmdb_rating?`<span class="badge">TMDB <span class="score">${m.tmdb_rating}</span></span>`:''}${m.genres?`<span class="badge">${esc(m.genres)}</span>`:''}</div>
    <button class="btn" data-m="${m.id}">View details</button></div></div>`};
  const atop=acts.length?`<h2 class="hh">Top Watched Actors</h2><div class="atop">${acts.map(a=>`<button class="at" data-a="${a.id}">${a.photo?`<img loading="lazy" src="${a.photo.replace('/w185/','/h632/')}" alt="">`:'<div class="ph"></div>'}<b>${esc(a.name)}</b><small>${a.n} title${a.n===1?'':'s'}</small></button>`).join('')}</div>`:'';
  el.innerHTML=`<div class="stats">${stat(lib.length,'Titles watched')}${stat(lib.filter(m=>m.id>0).length,'Movies')}${stat(lib.filter(m=>m.id<0).length,'Series')}</div>`
    +((tm.length||ts.length)?`<div class="duo">${tm.length?heroBox('m','Top Rated Movies',tm.length,titleSlide('m',tm)):''}${ts.length?heroBox('s','Top Rated Series',ts.length,titleSlide('s',ts)):''}</div>`:'')
    +atop
    +`<h3>Recently Added</h3><div class="grid">${lib.slice(0,6).map(card).join('')}</div>`;
  [['m',tm],['s',ts]].forEach(([k,l],j)=>{if(l.length)heroWire(k,l.length,5000+j*700)});
}
const rtxt=w=>CRS==='imdb'?(w.imdb_rating?'IMDb '+w.imdb_rating:null):CRS==='tmdb'?(w.tmdb_rating?'TMDB '+w.tmdb_rating:null):(avgOf(w)?'★ '+avgOf(w):null);
function listHTML(items){
  return`<div class="lst"><div class="lrow lh"><span>Title</span><span>Year</span><span>Type</span><span style="text-align:right">Rating</span></div>${items.map(m=>`<button class="lrow" data-m="${m.id}"><span class="lt">${esc(m.title)}</span><span class="ly">${esc(m.year||'')}</span><span class="lk">${m.id<0?'Series':'Movie'}</span><span class="lr score">${rtxt(m)||'–'}</span></button>`).join('')}</div>`;
}
function library(src){
  const L=src||lib;
  const el=$('#main');
  const gs=[...new Set(L.flatMap(m=>(m.genres||'').split(', ').filter(Boolean)))].sort();

  const actors=Object.values(all);
  for(let t=0;t<30;t++){
    if(Math.random()<.5){
      const pool=actors.filter(a=>!QS.usedA.has(a.id)),a=rnd(pool.length?pool:actors);
      const bad=lib.filter(m=>!(m.cast||[]).some(c=>c.id===a.id));
      if(bad.length<3)continue;
      QS.usedA.add(a.id);const good=rnd(a.films);
      return{mode:'who',kind:'a2f',actor:a,answer:good.title,opts:shuf([optT(good,true),...shuf(bad).slice(0,3).map(m=>optT(m,false))])};
    }else{
      const f=rnd(fresh(wc)),ids=new Set(f.cast.map(c=>c.id)),bad=actors.filter(a=>!ids.has(a.id));
      if(bad.length<3)continue;
      QS.used.add(f.id);const good=rnd(f.cast.slice(0,6));
      return{mode:'who',kind:'f2a',film:f,answer:good.name,opts:shuf([optA(good,true),...shuf(bad).slice(0,3).map(a=>optA(a,false))])};
    }
  }
  return null;
}
async function qKw(){
  for(let t=0;t<12;t++){
    const c=rnd(fresh(lib));let ks;
    try{ks=await getKw(c)}catch{continue}
    const words=c.title.toLowerCase().split(/\W+/).filter(w=>w.length>3);
    const clean=ks.filter(k=>!words.some(w=>k.toLowerCase().includes(w)));
    if(clean.length<3)continue;
    QS.used.add(c.id);
    return{mode:'kw',answer:c.title,clues:shuf(clean).slice(0,5),shown:3,opts:opts4(c)};
  }
  return null;
}
async function qHol(A0){
  const has=m=>+m.imdb_rating>0;
  for(let t=0;t<30;t++){
    const A=A0||rnd(lib),B=rnd(lib);if(B.id===A.id)continue;
    const crit=has(A)&&has(B)&&Math.random()<.5?'imdb':'mine';
    const v=m=>crit==='imdb'?+m.imdb_rating:num(avgOf(m));
    if(v(A)===v(B)&&t<25)continue;
    return{mode:'hol',A,B,crit,vA:v(A),vB:v(B)};
  }
  return null;
}

function startGame(mode){
  QS={screen:'play',mode,round:0,score:0,streak:0,maxStreak:0,used:new Set(),usedA:new Set(),q:null,answered:false,last:null,tok:0};
  nextQ();
}
async function nextQ(){
  clearInterval(QT);
  if(QS.mode!=='hol'&&QS.round>=ROUNDS){endGame();return}
  const prevB=QS.mode==='hol'&&QS.q&&QS.last?.ok?QS.q.B:null;
  QS.round++;QS.answered=false;QS.q=null;QS.fail=false;QS.pick=null;QS.last=null;drawPlay();
  const tok=++QS.tok;let q=null;
  try{q=await({blurry:qBlurry,who:qWho,kw:qKw,hol:qHol}[QS.mode])(prevB)}catch{}
  if(tok!==QS.tok||view!=='quiz'||QS.screen!=='play')return;
  if(!q)QS.fail=true;
  QS.q=q;drawPlay();
  if(q&&QS.mode==='blurry')startBlur();
}
function startBlur(){
  const q=QS.q,img=$('#qimg');if(!img)return;
  q.t0=Date.now();
  QT=setInterval(()=>{
    const f=Math.max(0,1-(Date.now()-q.t0)/12000);
    img.style.filter=`blur(${(f*26).toFixed(1)}px)`;
    const p=$('#qpts');if(p)p.textContent=`${20+Math.round(80*f)} points`;
    if(f<=0)clearInterval(QT);
  },120);
}
function answer(i){
  if(QS.answered||!QS.q)return;
  const q=QS.q;QS.answered=true;QS.pick=i;clearInterval(QT);
  const ok=!!q.opts[i].ok;let pts=0;
  if(ok){
    pts=QS.mode==='blurry'?20+Math.round(80*Math.max(0,1-(Date.now()-q.t0)/12000)):QS.mode==='kw'?Math.max(20,100-20*(q.shown-3)):100;
    QS.score+=pts;QS.streak++;QS.maxStreak=Math.max(QS.maxStreak,QS.streak);
  }else QS.streak=0;
  QS.last={ok,pts};drawPlay();
}
function holAnswer(dir){
  if(QS.answered||!QS.q)return;
  const q=QS.q;QS.answered=true;QS.pick=dir;
  const ok=dir==='h'?q.vB>=q.vA:q.vB<=q.vA;
  if(ok){QS.streak++;QS.score=QS.streak;QS.maxStreak=QS.streak}
  QS.last={ok,tie:q.vA===q.vB};drawPlay();
}
function endGame(){
  clearInterval(QT);
  const m=QS.mode,sc=m==='hol'?QS.streak:QS.score,b=QZ.best[m]||{score:0,streak:0};
  QS.newBest=sc>b.score;
  QZ.best[m]={score:Math.max(b.score,sc),streak:Math.max(b.streak,QS.maxStreak)};
  QZ.hist.unshift({m,sc,at:Date.now()});QZ.hist=QZ.hist.slice(0,20);
  save(qzKey(),QZ);QS.screen='end';drawEnd();
}
function drawPlay(){
  const q=QS.q,M=MODES[QS.mode],el=$('#main'),done=QS.answered;
  const info=QS.mode==='hol'?`Streak ${QS.streak}`:`Round ${QS.round}/${ROUNDS} · ${QS.score} pts${QS.streak>1?` · streak ${QS.streak}`:''}`;
  let h=`<div class="qbar"><b class="qt">${qIcon(QS.mode,'sm')}${M.name}</b><span>${info}</span><button class="btn ghost" data-qz="quit:">Quit</button></div>`;
  if(!q){el.innerHTML=h+`<p class="empty">${QS.fail?'Could not build a question. Check your connection and try again.':'Loading…'}</p>`;return}
  if(QS.mode==='hol'){
    const lab=q.crit==='imdb'?'IMDb rating':'your rating',fv=v=>q.crit==='imdb'?v.toFixed(1):'★ '+v.toFixed(1);
    const card=(m,val)=>`<div class="qc">${m.poster?`<img src="${m.poster}" alt="">`:'<div class="ph">No poster</div>'}<b>${esc(m.title)}</b><p class="meta">${esc(m.year||'')}</p><div class="qval">${val}</div></div>`;
    const cls=d=>done?(QS.pick===d?(QS.last.ok?' ok':' bad'):''):'';
    h+=`<p class="meta">Is the ${lab} of the right title higher or lower than the left one?</p><div class="qpair">${card(q.A,fv(q.vA))}${card(q.B,done?fv(q.vB):'?')}</div>
     <div class="qhl"><button class="qo${cls('h')}" data-qz="hl:h"${done?' disabled':''}>▲ Higher</button><button class="qo${cls('l')}" data-qz="hl:l"${done?' disabled':''}>▼ Lower</button></div>`;
    if(done)h+=`<div class="qfb ${QS.last.ok?'ok':'bad'}">${QS.last.ok?(QS.last.tie?'A tie, so that counts. ':'Correct! ')+`Streak ${QS.streak}.`:'Not quite.'}</div><button class="btn" data-qz="next:">${QS.last.ok?'Next':'See results'}</button>`;
    el.innerHTML=h;return;
  }
  if(QS.mode==='blurry')h+=`<div class="qstage"><div class="qwrap"><img id="qimg" class="qposter" src="${q.img}" style="filter:${done?'none':'blur(26px)'}" alt=""></div><p class="meta" id="qpts">${done?'':'100 points'}</p></div>`;
  if(QS.mode==='who')h+=q.kind==='a2f'
    ?`<div class="qstage">${q.actor.photo?`<img class="qposter" style="width:min(150px,42vw)" src="${q.actor.photo.replace('/w185/','/h632/')}" alt="">`:''}<h3>Which of these films was <b>${esc(q.actor.name)}</b> in?</h3></div>`
    :`<div class="qstage">${q.film.poster?`<img class="qposter" style="width:min(150px,42vw)" src="${q.film.poster}" alt="">`:''}<h3>Who was in <b>${esc(q.film.title)}</b>${q.film.year?` (${esc(q.film.year)})`:''}?</h3></div>`;
  if(QS.mode==='kw')h+=`<div class="qstage"><p class="meta">Which title do these keywords belong to?</p><div class="qclues">${q.clues.slice(0,q.shown).map(k=>`<span class="badge">${esc(k)}</span>`).join('')}</div>${!done&&q.shown<q.clues.length?'<button class="btn ghost" data-qz="clue:">Show another clue (−20 pts)</button>':''}</div>`;
  h+=`<div class="qopts">${q.opts.map((o,i)=>`<button class="qo${done?(o.ok?' ok':(QS.pick===i?' bad':'')):''}" data-qz="ans:${i}"${done?' disabled':''}>${o.html}</button>`).join('')}</div>`;
  if(done)h+=`<div class="qfb ${QS.last.ok?'ok':'bad'}">${QS.last.ok?`Correct! +${QS.last.pts} points`:`Not quite. The answer was <b>${esc(q.answer)}</b>.`}</div><button class="btn" data-qz="next:">${QS.round>=ROUNDS?'See results':'Next'}</button>`;
  el.innerHTML=h;
}
function drawEnd(){

/* TMDB has no awards or residence, so these come from Wikidata (via the actor's wikidata id) */
async function wd(qid){
  const u=x=>'https://www.wikidata.org/w/api.php?format=json&origin=*&'+x;
  const cl=(await(await fetch(u('action=wbgetentities&props=claims&ids='+qid))).json()).entities[qid].claims||{};
  const ids=c=>(c||[]).filter(x=>x.mainsnak?.datavalue?.value?.id);
  const aw=ids(cl.P166).map(x=>x.mainsnak.datavalue.value.id);
  const rs=ids(cl.P551).filter(x=>!x.qualifiers?.P582).map(x=>x.mainsnak.datavalue.value.id);
  const need=[...new Set([...rs.slice(-1),...aw])];
  if(!need.length)return{awards:[],total:0,home:''};
  const chunks=[];for(let i=0;i<need.length&&i<250;i+=50)chunks.push(need.slice(i,i+50));
  const parts=await Promise.all(chunks.map(c=>fetch(u('action=wbgetentities&props=labels&languages=en&ids='+c.join('|'))).then(r=>r.json())));
  const L=Object.assign({},...parts.map(x=>x.entities||{}));
  const lab=id=>L[id]?.labels?.en?.value||'';
  const pri=x=>/Academy|Oscar|Golden Globe|BAFTA|Emmy|Tony|Screen Actors|Cannes|Venice|Berlin|Grammy|César/i.test(x)?0:1;
  const names=[...new Set(aw.map(lab).filter(Boolean))].sort((x,y)=>pri(x)-pri(y));
  return{awards:names,total:new Set(aw).size,home:rs.length?lab(rs[rs.length-1]):''};
}

    <h2>${esc(p.name)}</h2>
    <div class="facts">
     ${p.birthday?`<p><span class="k">Born</span><span class="v">${fmt(p.birthday)}${p.deathday?'':` (age ${ageOf(p.birthday)})`}</span></p>`:''}
     ${p.deathday?`<p><span class="k">Died</span><span class="v">${fmt(p.deathday)}${p.birthday?` (age ${ageOf(p.birthday,p.deathday)})`:''}</span></p>`:''}
     ${p.place_of_birth?`<p><span class="k">Birthplace</span><span class="v">${esc(p.place_of_birth)}</span></p>`:''}
     ${p.deathday?'':'<p id="lv" hidden><span class="k">Lives in</span><span class="v"></span></p>'}
     </div>
    ${bio?`<p class="clip">${esc(bio)}</p><button class="vm">View more</button>`:''}
    <details class="kwd mkw" id="aw"><summary>Awards</summary><div class="v">Loading…</div></details>
    <div class="badges"><span class="badge">You’ve watched <span class="score">${n}</span> of ${films.length} titles</span></div></div></div>
    <h3 id="wk">Other work (${films.length})</h3><div id="work"></div>`);
  $('#sheet').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openMovie(+b.dataset.m));
  wireClips($('#sheet'));
  const per=20,pages=Math.max(1,Math.ceil(films.length/per));let wp=1;
  const draw=()=>{
    $('#work').innerHTML=films.length?`<div class="grid">${films.slice((wp-1)*per,wp*per).map(f=>card(f)).join('')}</div>${pager(wp,pages,'wp')}`:'<p class="meta">No other titles found.</p>';
    $('#work').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openMovie(+b.dataset.m));
    $('#work').querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>{wp=+b.dataset.wp;draw();$('#wk').scrollIntoView({block:'start'})});
  };
  draw();
  const setAw=h=>{if(actorTok===pid&&$('#aw .v'))$('#aw .v').innerHTML=h};
  const qid=p.external_ids?.wikidata_id;
  if(!qid){setAw('Not available');return}
  wd(qid).then(r=>{
    if(actorTok!==pid)return;
    if(r.home&&$('#lv')){$('#lv').hidden=false;$('#lv .v').textContent=r.home}
    setAw(awardsHTML(r.awards));
  }).catch(()=>setAw('Could not load awards'));
}

/* ---------- full-screen photos ---------- */
const lb=document.createElement('div');lb.id='lb';lb.hidden=true;
lb.innerHTML='<img alt=""><button class="lbx" aria-label="Close">✕</button><button class="lbp l" aria-label="Previous photo">‹</button><button class="lbp r" aria-label="Next photo">›</button>';
document.body.appendChild(lb);
let LB={list:[],i:0};
function lbShow(){lb.querySelector('img').src=LB.list[LB.i];lb.querySelectorAll('.lbp').forEach(b=>b.hidden=LB.list.length<2)}
function lbStep(d){const j=LB.i+d;if(j<0||j>=LB.list.length)return;LB.i=j;lbShow()}
lb.onclick=e=>{const c=e.target.classList;if(c.contains('lbp'))lbStep(c.contains('r')?1:-1);else lb.hidden=true};
document.addEventListener('click',e=>{
  const i=e.target.closest('img.zm');if(!i)return;
  const grp=[...(i.closest('.strip')||i.parentElement).querySelectorAll('img.zm')];
  LB={list:grp.map(x=>x.dataset.full||x.src),i:grp.indexOf(i)};lbShow();lb.hidden=false;
});

/* ---------- swipe to browse the next / previous title or actor ---------- */
let NAV=null;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-m],[data-a]');if(!el)return;
  const k=el.dataset.m!==undefined?'m':'a';
  const box=el.closest('.grid,.lb,.cast,.hero,.atop,.lst')||document;
  const ids=[...box.querySelectorAll(`[data-${k}]`)].map(x=>+x.dataset[k]);
  NAV={k,ids,i:ids.indexOf(+el.dataset[k])};
},true);
function navStep(d){
  if(!NAV)return;const j=NAV.i+d;if(j<0||j>=NAV.ids.length)return;
  NAV.i=j;$('#modal').scrollTop=0;
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)$('#sheet').animate([{transform:`translateX(${d*48}px)`,opacity:.2},{transform:'none',opacity:1}],{duration:220,easing:'ease-out'});
  MODE='replace';
  NAV.k==='m'?openMovie(NAV.ids[j]):openActor(NAV.ids[j]);
}
function onSwipe(el,cb,skip){
  let x,y,ok;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];x=t.clientX;y=t.clientY;ok=!(skip&&e.target.closest(skip))},{passive:true});
  el.addEventListener('touchend',e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-x,dy=t.clientY-y;if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))cb(dx<0?1:-1)},{passive:true});
}
onSwipe($('#modal'),navStep,'.strip,.cast');
onSwipe(lb,lbStep,null);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;
  if(!lb.hidden)lbStep(d);else if($('#modal').classList.contains('open'))navStep(d);
});

/* ---------- boot ---------- */
async function reloadAll(){
  if(SESS&&SESS.expires_at<Date.now()/1000+60)await refreshSess();
  await loadProfile();
  QZ=load(qzKey())||(isAdmin()&&load('quiz'))||{best:{},hist:[]};
  const sp=sitesLoad();
  all=[];
  if(canUse()){try{all=await dbAll()}catch(e){console.error(e)}}
  split();await sp;
  PENDING=0;
  if(isAdmin()){try{const r=await sbf('/rest/v1/profiles?approved=eq.false&select=id');if(r.ok)PENDING=(await r.json()).length}catch{}}
}
async function afterAuth(go){
  USERS=null;await reloadAll();
  view=go==='account'&&PROF?'account':canUse()?(go&&go!=='public'?go:'dashboard'):(go==='public'||!PROF?'public':'account');
  render();window.scrollTo(0,0);
}
async function boot(){await reloadAll()}
if(history.state&&history.state.k)history.replaceState(null,'');
boot().then(()=>{split();view=canUse()?'dashboard':'public';render()});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BidoMeter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BidoMeter">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--card:#151515;--line:#2b2b2b;--ink:#efefef;--mute:#9b9b9b;--hot:#b036ad;--glow:rgba(176,54,173,.55);--red:#ff6b81}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.55);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid rgba(255,255,255,.08);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:1.3rem;flex:1 1 100%}
header form{flex:1 1 240px;display:flex;gap:6px}
input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.btn{background:var(--hot);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red)}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mute);font-weight:600}
nav button.on{background:var(--card);color:var(--hot)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.poster{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.poster img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:grid;place-items:center;background:var(--card);color:var(--mute)}
.poster div{padding:8px 10px;font-size:.9rem}
.poster small{color:var(--mute);display:block}
.score{color:var(--hot);font-weight:600}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.msg{background:var(--card);border-left:4px solid var(--hot);padding:12px 14px;border-radius:6px;margin-bottom:16px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;z-index:10;overflow:auto;padding:16px}
#modal.open{display:block}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:14px;max-width:820px;margin:0 auto;padding:20px;position:relative}
.x{position:absolute;right:12px;top:12px;background:var(--card);border:0;border-radius:50%;width:36px;height:36px}
.top{display:flex;gap:18px;flex-wrap:wrap}
.top img{width:170px;border-radius:10px;align-self:flex-start}
.top>div{flex:1 1 260px}
.meta{color:var(--mute);margin:6px 0 10px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.badge{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:.85rem}
.cast{display:flex;gap:12px;overflow-x:auto;padding:8px 0}
.cast button{background:none;border:0;width:84px;flex:none;text-align:center;font-size:.8rem}
.cast img,.cast .ph{width:72px;height:72px;border-radius:50%;margin:0 auto 4px;aspect-ratio:1}
.rate{background:var(--card);border-radius:10px;padding:14px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.stars button{background:none;border:0;font-size:1.7rem;color:#444;padding:0 2px}
.stars button.f{color:var(--hot)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lb{list-style:none;padding:0}
.lb li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.lb img,.lb .ph{width:48px;height:48px;border-radius:50%;aspect-ratio:1}
.lb b{margin-left:auto;font-family:'Bricolage Grotesque';font-size:1.4rem;color:var(--hot)}
.lb .rk{width:28px;color:var(--mute)}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
h2{margin:0 0 14px}h3{margin:20px 0 6px}

select{display:block;width:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font:inherit}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;align-items:end}
.filters label{margin:0;font-size:.8rem}
.filters input{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:800 1.6rem 'Bricolage Grotesque',system-ui,sans-serif;color:var(--hot)}
.stat span{color:var(--mute);font-size:.85rem}
.hero{position:relative;height:460px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.slide{position:absolute;inset:0;display:flex;gap:24px;align-items:flex-end;padding:28px 64px 48px;opacity:0;transition:opacity .7s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,10,.96) 0%,rgba(10,10,10,.6) 45%,rgba(10,10,10,.1) 100%)}
.slide .txt{position:relative;min-width:0}
.slide h2{font-size:2.2rem;margin:4px 0}
.slide .meta{margin:0}
.sr{color:var(--hot);letter-spacing:2px;font-size:1.2rem}
.ov{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 4px;max-width:60ch}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,10,.6);font-size:1.3rem}
.arrow.l{left:10px}.arrow.r{right:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#444;padding:0}
.dots button.on{background:var(--hot);width:26px;border-radius:6px}
@media(max-width:640px){.hero{height:520px}.slide{padding:20px 16px 44px}.slide h2{font-size:1.5rem}.arrow{display:none}}
@media(prefers-reduced-motion:reduce){.slide{transition:none}}
.score,.sr,.stars button.f,.stat b,.lb b{text-shadow:0 0 10px var(--glow)}
.dots button.on{box-shadow:0 0 10px var(--glow)}
.hero{box-shadow:0 0 24px rgba(176,54,173,.25)}
.slide .txt{text-shadow:0 1px 8px rgba(0,0,0,.7)}
.cast img,.lb img{object-fit:cover;object-position:center top;flex:none}
.lb .ph{flex:none}
.st{position:relative;display:inline-block;margin-right:3px;color:#4a4a4a}
.st::before{content:'★'}
.st i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;font-style:normal;color:var(--hot)}
.cast button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;min-height:2.5em;width:100%}
nav button{padding:8px 10px}
nav button svg{display:block;width:22px;height:22px}
.sr svg{width:1.25rem;height:1.25rem;margin-right:2px;vertical-align:-4px}
header input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
#sf{position:relative}
#sf input{padding-right:46px}
.sbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--mute)}
.sbtn:hover{color:var(--hot)}
.sbtn svg{width:20px;height:20px}
.ic{display:inline-grid;place-items:center;padding:9px 11px;justify-self:start}
.ic svg{width:20px;height:20px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-top:30px}
.strip+.top{margin-top:10px}
.strip.wide img{height:170px;aspect-ratio:16/9}
.strip img{flex:none;height:210px;aspect-ratio:2/3;object-fit:cover;border-radius:10px}
.facts{margin:8px 0 10px}
.facts p{display:flex;gap:10px;margin:3px 0}
.facts .k{flex:none;width:84px;color:var(--mute)}
.facts .v{min-width:0}
[hidden]{display:none!important}
.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.ov.clip{-webkit-line-clamp:3}
.clip.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.vm{display:block;background:none;border:0;padding:2px 0;margin:0 0 10px;color:var(--hot);font-weight:600}
.slide .txt{max-height:100%;overflow-y:auto}
img.zm{cursor:zoom-in}
.strip.wide{margin-top:16px}
.top h2{padding-right:44px}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:100vw;max-height:100vh;object-fit:contain}
.lbx,.lbp{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.4rem}
.lbx{top:14px;right:14px}
.lbp{top:50%;transform:translateY(-50%)}
.lbp.l{left:12px}.lbp.r{right:12px}
.aw .awn{margin:0 0 6px}
.aw .vm{margin:6px 0 0}
header h1{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;flex:none;color:var(--hot)}
</style>
</head>
<body>
<header>
  <h1><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><mask id="pm"><rect width="64" height="64" fill="#fff"/><path d="M25 33L26.8 58M39 33L37.2 58" stroke="#000" stroke-width="2.6"/></mask>
<g fill="currentColor"><circle cx="16" cy="24" r="6.5"/><circle cx="23" cy="16" r="7.5"/><circle cx="34" cy="11" r="8"/><circle cx="44" cy="16" r="7.5"/><circle cx="48" cy="25" r="6.5"/><circle cx="32" cy="24" r="8.5"/><path mask="url(#pm)" d="M11 33h42l-5.5 25h-31z"/></g></svg>BidoMeter</h1>
  <form id="sf"><input id="q" placeholder="Search a movie or series to add…" aria-label="Search movies and series"><button class="sbtn" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></form>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- config & storage ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const DEF={tmdb:'839adee8e20e6a241d50bf54b4e86116',omdb:'f994cdc4',sbUrl:'https://cnktxqtdrtztkcveuimj.supabase.co',sbKey:'sb_publishable_Z4hYMpx8Ehk87fAjAi5Gnw_L9VcmYB_'};
let cfg={...DEF,...(load('cfg')||{})};
if(!cfg.sbUrl)cfg.sbUrl=DEF.sbUrl;
if(!cfg.sbKey)cfg.sbKey=DEF.sbKey;
cfg.sbUrl=cfg.sbUrl.replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
if(!cfg.tmdb)cfg.tmdb=DEF.tmdb;
if(!cfg.omdb)cfg.omdb=DEF.omdb;
let lib=[],view='library',results=[];
let all=[],wl=[];
const isW=m=>CATS.every(([k])=>m.ratings&&m.ratings[k]);
function split(){lib=all.filter(isW);wl=all.filter(m=>!isW(m))}
const IMG='https://image.tmdb.org/t/p/';
/* Series are stored with a negative id (-tmdbId) so they never clash with movie ids; no table change needed */
const norm=r=>({id:r.media_type==='tv'?-r.id:r.id,title:r.title||r.name,release_date:r.release_date||r.first_air_date,poster_path:r.poster_path});
const CATS=[['story','Story'],['prod','Quality'],['perf','Performance'],['like','BidoMeter']];

const sbOn=()=>cfg.sbUrl&&cfg.sbKey;
const sbH=()=>({apikey:cfg.sbKey,...(cfg.sbKey.startsWith('eyJ')?{Authorization:'Bearer '+cfg.sbKey}:{}),'Content-Type':'application/json'});
async function dbAll(){
  if(!sbOn())return load('lib')||[];
  const r=await fetch(cfg.sbUrl+'/rest/v1/movies?select=*&order=created_at.desc',{headers:sbH()});
  if(!r.ok)throw new Error('Supabase: '+r.status);
  return r.json();
}
async function dbSave(m){
  if(!sbOn()){all=all.filter(x=>x.id!==m.id);all.unshift(m);save('lib',all);split();return}
  const r=await fetch(cfg.sbUrl+'/rest/v1/movies',{method:'POST',headers:{...sbH(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify(m)});
  if(!r.ok)throw new Error('Supabase: '+r.status);
  all=await dbAll();split();
}
async function dbDel(id){
  if(!sbOn()){all=all.filter(x=>x.id!==id);save('lib',all);split();return}
  await fetch(cfg.sbUrl+'/rest/v1/movies?id=eq.'+id,{method:'DELETE',headers:sbH()});
  all=await dbAll();split();
}

/* ---------- APIs ---------- */
async function tmdb(path){
  if(!cfg.tmdb)throw new Error('TMDB API key is missing.');
  const r=await fetch('https://api.themoviedb.org/3'+path+(path.includes('?')?'&':'?')+'api_key='+cfg.tmdb);
  if(!r.ok)throw new Error('TMDB error '+r.status+'. Check your API key.');
  return r.json();
}
async function omdbData(id){
  if(!cfg.omdb||!id)return null;
  try{return await(await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${cfg.omdb}`)).json()}catch{return null}
}
async function imdbRating(id){
  if(!cfg.omdb||!id)return null;
  try{const d=await(await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${cfg.omdb}`)).json();return d.imdbRating&&d.imdbRating!=='N/A'?d.imdbRating:null}catch{return null}
}

/* ---------- views ---------- */
const IC={
 dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 library:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h18M3 16h4M17 8h4M17 16h4"/>',
 watch:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 board:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'};
function nav(){
  $('#nav').innerHTML=[['dashboard','Dashboard'],['library','Library'],['watch','To Watch'],['board','Leaderboard']]
   .map(([k,l])=>`<button class="${view===k?'on':''}" data-v="${k}" aria-label="${l}" title="${l}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg></button>`).join('');
}
$('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render()}};
$('#sf').onsubmit=async e=>{
  e.preventDefault();const q=$('#q').value.trim();if(!q)return;
  view='search';nav();$('#main').innerHTML='<p class="empty">Searching…</p>';
  try{results=(await tmdb('/search/multi?query='+encodeURIComponent(q))).results.filter(r=>r.media_type==='movie'||r.media_type==='tv').map(norm)}
  catch(err){$('#main').innerHTML=`<div class="msg">${esc(err.message)}</div>`;return}
  render();
};
function card(m){
  const w=all.find(x=>x.id===m.id);
  const yr=(m.year||(m.release_date||'').slice(0,4)||'');
  const poster=m.poster||(m.poster_path?IMG+'w342'+m.poster_path:'');
  const avg=w?avgOf(w):null;
  return `<button class="poster" data-m="${m.id}">${poster?`<img loading="lazy" src="${poster}" alt="">`:`<div class="ph">No poster</div>`}
  <div>${esc(m.title)}<small>${yr}${m.id<0?' · Series':''}${w&&!isW(w)?' · To Watch':''}${avg?` · <span class="score">★ ${avg}</span>`:''}</small></div></button>`;
}
const avgOf=m=>{const v=Object.values(m.ratings||{}).filter(Boolean);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null};

function wireClips(root){
  root.querySelectorAll('.clip').forEach(el=>{
    const b=el.nextElementSibling;if(!b||!b.classList.contains('vm'))return;
    if(el.scrollHeight<=el.clientHeight+1){b.hidden=true;return}
    b.onclick=()=>{const o=el.classList.toggle('open');b.textContent=o?'View less':'View more'};
  });
}
let si=0,timer;
const F0={type:'all',genre:'all',year:'all',sort:'mine'},F={...F0};
const num=x=>+x||0;
function go(n){
  const sl=document.querySelectorAll('.slide'),ds=document.querySelectorAll('.dots button');
  if(!sl.length)return;document.querySelectorAll('.slide .clip.open').forEach(e=>{e.classList.remove('open');e.nextElementSibling.textContent='View more'});si=(n+sl.length)%sl.length;
  sl.forEach((e,i)=>e.classList.toggle('on',i===si));ds.forEach((e,i)=>e.classList.toggle('on',i===si));
}
function dash(){
  const el=$('#main');
  if(!lib.length){el.innerHTML='<h2>Dashboard</h2><p class="empty">Your top rated titles will play here once you log something. Search for a movie or series above to start.</p>';return}
  const rated=lib.filter(m=>num(avgOf(m)));
  const top=[...rated].sort((a,b)=>num(avgOf(b))-num(avgOf(a))||num(b.imdb_rating)-num(a.imdb_rating)).slice(0,6);
  const mv=lib.filter(m=>m.id>0).length;
  const ac={};lib.forEach(m=>(m.cast||[]).forEach(a=>{(ac[a.id]??={name:a.name,n:0}).n++}));
  const ta=Object.values(ac).sort((a,b)=>b.n-a.n)[0];
  const stat=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const SP='M12 1.7l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 17.8l-6.4 3.6L7 14.2 1.7 9.2l7.2-.9z';
  const star=(n,u)=>[0,1,2,3,4].map(i=>{const f=Math.round(Math.max(0,Math.min(1,n-i))*100);return `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g${u}_${i}"><stop offset="${f}%" style="stop-color:var(--hot)"/><stop offset="${f}%" style="stop-color:#4a4a4a"/></linearGradient></defs><path d="${SP}" fill="url(#g${u}_${i})"/></svg>`}).join('');
  si=si%top.length;
  el.innerHTML=`<h2>Your top rated</h2><div class="hero" id="hero">
   ${top.map((m,i)=>{const a=avgOf(m);return `<div class="slide ${i===si?'on':''}">${m.poster?`<img class="full" src="${m.poster.replace('/w342/','/w780/')}" alt="">`:''}<div class="shade"></div>
    <div class="txt"><p class="meta">#${i+1} · ${m.id<0?'Series':'Movie'} · ${m.year}</p><h2>${esc(m.title)}</h2>
    <p><span class="sr">${star(a,i)}</span> <span class="score">${a}</span> <span class="meta">your rating</span></p>
    <div class="badges">${m.imdb_rating?`<span class="badge">IMDb <span class="score">${m.imdb_rating}</span></span>`:''}${m.tmdb_rating?`<span class="badge">TMDB <span class="score">${m.tmdb_rating}</span></span>`:''}${m.genres?`<span class="badge">${esc(m.genres)}</span>`:''}</div>
    <p class="ov clip">${esc(m.overview)}</p><button class="vm">View more</button><button class="btn" data-m="${m.id}">View details</button></div></div>`}).join('')}
   <button class="arrow l" id="prev" aria-label="Previous">‹</button><button class="arrow r" id="next" aria-label="Next">›</button>
   <div class="dots">${top.map((_,i)=>`<button aria-label="Show slide ${i+1}" class="${i===si?'on':''}"></button>`).join('')}</div></div>
  <div class="stats">${stat(lib.length,'Titles watched')}${stat(mv,'Movies')}${stat(lib.length-mv,'Series')}${stat(ta?esc(ta.name):'–',ta?`Most watched actor (${ta.n})`:'Most watched actor')}</div>
  <h3>Recently added</h3><div class="grid">${lib.slice(0,6).map(card).join('')}</div>`;
  wireClips(el);
  const hero=$('#hero'),n=top.length;
  const start=()=>{clearInterval(timer);if(n>1)timer=setInterval(()=>go(si+1),5000)};
  hero.querySelectorAll('.dots button').forEach((b,i)=>b.onclick=()=>{go(i);start()});
  $('#prev').onclick=()=>{go(si-1);start()};$('#next').onclick=()=>{go(si+1);start()};
  hero.onmouseenter=()=>clearInterval(timer);hero.onmouseleave=start;start();
  hero.querySelectorAll('.vm').forEach(b=>b.addEventListener('click',()=>clearInterval(timer)));
}
function library(){
  const el=$('#main');
  const gs=[...new Set(lib.flatMap(m=>(m.genres||'').split(', ').filter(Boolean)))].sort();
  const sel=(k,opts)=>`<select data-f="${k}">${opts.map(([v,l])=>`<option value="${esc(v)}"${String(F[k])===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const yrs=[...new Set(lib.map(m=>m.year).filter(Boolean))].sort().reverse();
  el.innerHTML=`<h2>Watched <span id="cnt"></span></h2><div class="filters">
   <label>Type${sel('type',[['all','All'],['movie','Movies'],['tv','Series']])}</label>
   <label>Genre${sel('genre',[['all','All genres'],...gs.map(g=>[g,g])])}</label>
   <label>Release year${sel('year',[['all','All years'],...yrs.map(y=>[y,y])])}</label>



   <label>Sort by${sel('sort',[['recent','Recently added'],['az','Title A–Z'],['za','Title Z–A'],['new','Release: newest'],['old','Release: oldest'],['mine','My rating'],['imdb','IMDb rating'],['tmdb','TMDB rating']])}</label>
   <button class="btn ghost ic" id="rs" aria-label="Reset filters" title="Reset filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div><div id="res"></div>`;
  const by={recent:()=>0,az:(a,b)=>a.title.localeCompare(b.title),za:(a,b)=>b.title.localeCompare(a.title),
    new:(a,b)=>num(b.year)-num(a.year),old:(a,b)=>num(a.year)-num(b.year),
    mine:(a,b)=>num(avgOf(b))-num(avgOf(a)),imdb:(a,b)=>num(b.imdb_rating)-num(a.imdb_rating),tmdb:(a,b)=>num(b.tmdb_rating)-num(a.tmdb_rating)};
  const paint=()=>{
    const l=lib.filter(m=>(F.type==='all'||(F.type==='tv')===(m.id<0))&&(F.genre==='all'||(m.genres||'').split(', ').includes(F.genre))
      &&(F.year==='all'||m.year===F.year)).sort(by[F.sort]);
    $('#cnt').textContent=`(${l.length}${l.length!==lib.length?' of '+lib.length:''})`;
    $('#res').innerHTML=l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p class="empty">${lib.length?'No titles match these filters.':'Nothing here yet. Search for a movie or series above to log your first one.'}</p>`;
  };
  $('.filters').oninput=e=>{const k=e.target.dataset.f;if(!k)return;F[k]=e.target.value;paint()};
  $('#rs').onclick=()=>{Object.assign(F,F0);library()};
  paint();
}
function watchView(){
  $('#main').innerHTML=`<h2>To Watch (${wl.length})</h2>`+(wl.length?`<div class="grid">${wl.map(card).join('')}</div>`:'<p class="empty">Nothing on your list yet. Search for a movie or series and press + To Watch.</p>');
}
function render(){
  clearInterval(timer);nav();const el=$('#main');
  if(view==='dashboard')dash();
  else if(view==='library')library();
  else if(view==='watch')watchView();
  else if(view==='search'){
    el.innerHTML=`<h2>Results</h2>`+(results.length?`<div class="grid">${results.map(card).join('')}</div>`:'<p class="empty">No movies found.</p>');

  }
}
$('#main').onclick=e=>{

const open=h=>{$('#sheet').innerHTML=`<button class="x" aria-label="Close" onclick="closeM()">✕</button>`+h;$('#modal').classList.add('open')};

async function openMovie(id){
  open('<p class="empty">Loading…</p>');
  let d,saved=all.find(x=>x.id===id);
  const tv=id<0;
  try{d=await tmdb(tv?`/tv/${-id}?append_to_response=aggregate_credits,external_ids,images&include_image_language=en,null`:`/movie/${id}?append_to_response=credits,external_ids,images&include_image_language=en,null`)}
  catch(err){open(`<div class="msg">${esc(err.message)}</div>`);return}
  const imdbId=d.external_ids?.imdb_id||null;
  const shots=(d.images?.backdrops||[]).slice(0,16).map(x=>x.file_path);
  const cr=tv?d.aggregate_credits:d.credits;
  const info=tv?`Series · ${d.number_of_seasons} season${d.number_of_seasons===1?'':'s'} · ${d.number_of_episodes} episodes`:`${d.runtime||'?'} min`;
  const m={id,title:d.title||d.name,year:(d.release_date||d.first_air_date||'').slice(0,4),poster:d.poster_path?IMG+'w342'+d.poster_path:'',
    overview:d.overview,runtime:tv?(d.episode_run_time?.[0]||null):d.runtime,genres:(d.genres||[]).map(g=>g.name).join(', '),
    tmdb_rating:d.vote_average?+d.vote_average.toFixed(1):null,imdb_id:imdbId,
    director:tv?(d.created_by||[]).map(c=>c.name).join(', '):(d.credits?.crew||[]).filter(c=>c.job==='Director').map(c=>c.name).join(', '),
    cast:(cr?.cast||[]).slice(0,12).map(c=>({id:c.id,name:c.name,character:c.character||c.roles?.[0]?.character||'',photo:c.profile_path?IMG+'w185'+c.profile_path:''})),
    imdb_rating:saved?.imdb_rating||null,ratings:saved?.ratings||{}};
  const om=await omdbData(imdbId);
  if(!m.imdb_rating&&om?.imdbRating&&om.imdbRating!=='N/A')m.imdb_rating=om.imdbRating;
  let awH='Loading…';
  const r={...m.ratings};
  const paint=()=>{
    const watched=saved&&isW(saved);
    open(`<div class="top">${m.poster?`<img class="zm" src="${m.poster}" data-full="${m.poster.replace('/w342/','/w780/')}" alt="">`:''}<div>
      <h2>${esc(m.title)}</h2><p class="meta">${m.year} · ${info} · ${esc(m.genres)}</p>
      <div class="badges">${m.imdb_rating?`<span class="badge">IMDb <span class="score">${m.imdb_rating}</span></span>`:''}
      ${m.tmdb_rating?`<span class="badge">TMDB <span class="score">${m.tmdb_rating}</span></span>`:''}
      ${m.director?`<span class="badge">${tv?'Created by':'Dir.'} ${esc(m.director)}</span>`:''}
      ${imdbId?`<a class="badge" style="color:var(--hot)" target="_blank" rel="noopener" href="https://www.imdb.com/title/${imdbId}/">View on IMDb</a>`:''}</div>
      <p class="clip">${esc(m.overview)}</p><button class="vm">View more</button>
      <div class="facts"><p id="maw"><span class="k">Awards</span><span class="v">${awH}</span></p></div></div></div>
    ${shots.length?`<div class="strip wide">${shots.map(f=>`<img class="zm" loading="lazy" src="${IMG}w780${f}" data-full="${IMG}w1280${f}" alt="">`).join('')}</div>`:''}<h3>Cast</h3><div class="cast">${m.cast.map(a=>`<button data-a="${a.id}">${a.photo?`<img src="${a.photo}" alt="">`:'<div class="ph"></div>'}<span class="nm">${esc(a.name)}</span></button>`).join('')}</div>
    <div class="rate"><h3 style="margin-top:0">${watched?'Your ratings':'Rate it to mark it as watched'}</h3>
    ${CATS.map(([k,l])=>`<div class="row"><span>${l}</span><span class="stars">${[1,2,3,4,5].map(n=>`<button data-k="${k}" data-n="${n}" aria-label="${n} stars" class="${(r[k]||0)>=n?'f':''}">★</button>`).join('')}</span></div>`).join('')}
    <div class="acts"><button class="btn" id="add">${watched?'Update ratings':'Rate'}</button>${!saved?'<button class="btn ghost" id="wl">+ To Watch</button>':''}${saved?`<button class="btn danger ic" id="rm" aria-label="${watched?'Remove':'Remove from To Watch'}" title="${watched?'Remove':'Remove from To Watch'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>`:''}</div></div>`);
    $('#sheet').querySelectorAll('.stars button').forEach(b=>b.onclick=()=>{r[b.dataset.k]=+b.dataset.n;paint()});
    $('#sheet').querySelectorAll('.cast button').forEach(b=>b.onclick=()=>openActor(+b.dataset.a));
    wireClips($('#sheet'));
    $('#add').onclick=async()=>{
      if(CATS.some(([k])=>!r[k])){alert('Rate all four categories first.');return}
      m.ratings=r;try{await dbSave(m);saved=m;paint()}catch(e){alert(e.message)}};
    $('#wl')&&($('#wl').onclick=async()=>{m.ratings={};try{await dbSave(m);saved=m;paint()}catch(e){alert(e.message)}});
    $('#rm')&&($('#rm').onclick=async()=>{await dbDel(id);closeM()});
  };
  paint();
  movieTok=id;
  Promise.all([om?.Awards&&om.Awards!=='N/A'?om.Awards:'',d.external_ids?.wikidata_id?wd(d.external_ids.wikidata_id).catch(()=>null):null]).then(([note,wk])=>{
    awH=awardsHTML(wk?.awards||[],note);
    if(movieTok===id&&$('#maw .v'))$('#maw .v').innerHTML=awH;
  });
}

let actorTok=0,movieTok=0;
function awardsHTML(names,note){
  if(!names.length&&!note)return'None listed';
  const rest=names.slice(3);
  const bd=(x,h)=>`<span class="badge"${h?' data-x hidden':''}>${esc(x)}</span>`;
  return`<div class="aw">${note?`<p class="awn">${esc(note)}</p>`:''}${names.length?`<div class="badges" style="margin:0">${names.slice(0,3).map(x=>bd(x)).join('')}${rest.map(x=>bd(x,1)).join('')}</div>`:''}${rest.length?`<button class="vm" data-showall="${names.length}">Show all (${names.length})</button>`:''}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-showall]');if(!b)return;
  const on=b.dataset.on!=='1';b.dataset.on=on?'1':'0';
  b.closest('.aw').querySelectorAll('[data-x]').forEach(x=>x.hidden=!on);
  b.textContent=on?'Show less':`Show all (${b.dataset.showall})`;
});
/* TMDB has no awards or residence, so these come from Wikidata (via the actor's wikidata id) */
async function wd(qid){
  const u=x=>'https://www.wikidata.org/w/api.php?format=json&origin=*&'+x;
  const cl=(await(await fetch(u('action=wbgetentities&props=claims&ids='+qid))).json()).entities[qid].claims||{};
  const ids=c=>(c||[]).filter(x=>x.mainsnak?.datavalue?.value?.id);
  const aw=ids(cl.P166).map(x=>x.mainsnak.datavalue.value.id);
  const rs=ids(cl.P551).filter(x=>!x.qualifiers?.P582).map(x=>x.mainsnak.datavalue.value.id);
  const need=[...new Set([...rs.slice(-1),...aw])];
  if(!need.length)return{awards:[],total:0,home:''};
  const chunks=[];for(let i=0;i<need.length&&i<250;i+=50)chunks.push(need.slice(i,i+50));
  const parts=await Promise.all(chunks.map(c=>fetch(u('action=wbgetentities&props=labels&languages=en&ids='+c.join('|'))).then(r=>r.json())));
  const L=Object.assign({},...parts.map(x=>x.entities||{}));
  const lab=id=>L[id]?.labels?.en?.value||'';
  const pri=x=>/Academy|Oscar|Golden Globe|BAFTA|Emmy|Tony|Screen Actors|Cannes|Venice|Berlin|Grammy|César/i.test(x)?0:1;
  const names=[...new Set(aw.map(lab).filter(Boolean))].sort((x,y)=>pri(x)-pri(y));
  return{awards:names,total:new Set(aw).size,home:rs.length?lab(rs[rs.length-1]):''};
}
async function openActor(pid){
  actorTok=pid;
  open('<p class="empty">Loading…</p>');
  let p,c;
  try{[p,c]=await Promise.all([tmdb(`/person/${pid}?append_to_response=external_ids,images`),tmdb(`/person/${pid}/combined_credits`)])}
  catch(err){open(`<div class="msg">${esc(err.message)}</div>`);return}
  const seen=new Set(),films=(c.cast||[]).filter(f=>(f.media_type==='movie'||f.media_type==='tv')&&!/self|himself|herself/i.test(f.character||'')&&!(f.genre_ids||[]).some(g=>[10767,10763,10764].includes(g))).map(norm).filter(f=>f.release_date&&!seen.has(f.id)&&seen.add(f.id)).sort((a,b)=>b.release_date.localeCompare(a.release_date));
  const n=films.filter(f=>lib.some(x=>x.id===f.id)).length;
  const D=d=>new Date(d+'T00:00:00');
  const fmt=d=>D(d).toLocaleDateString('en',{year:'numeric',month:'long',day:'numeric'});
  const ageOf=(b,e)=>{const B=D(b),E=e?D(e):new Date();let a=E.getFullYear()-B.getFullYear();if(E.getMonth()<B.getMonth()||(E.getMonth()===B.getMonth()&&E.getDate()<B.getDate()))a--;return a};
  const pics=(p.images?.profiles||[]).slice(0,24).map(x=>x.file_path);
  if(!pics.length&&p.profile_path)pics.push(p.profile_path);
  const bio=p.biography||'';
  open(`${pics.length?`<div class="strip">${pics.map(f=>`<img class="zm" loading="lazy" src="${IMG}w342${f}" data-full="${IMG}h632${f}" alt="">`).join('')}</div>`:''}<div class="top"><div>
    <h2>${esc(p.name)}</h2>
    <div class="facts">
     ${p.birthday?`<p><span class="k">Born</span><span class="v">${fmt(p.birthday)}${p.deathday?'':` (age ${ageOf(p.birthday)})`}</span></p>`:''}
     ${p.deathday?`<p><span class="k">Died</span><span class="v">${fmt(p.deathday)}${p.birthday?` (age ${ageOf(p.birthday,p.deathday)})`:''}</span></p>`:''}
     ${p.place_of_birth?`<p><span class="k">Birthplace</span><span class="v">${esc(p.place_of_birth)}</span></p>`:''}
     ${p.deathday?'':'<p id="lv" hidden><span class="k">Lives in</span><span class="v"></span></p>'}
     <p id="aw"><span class="k">Awards</span><span class="v">Loading…</span></p>
    </div>
    <div class="badges"><span class="badge">You’ve watched <span class="score">${n}</span> of ${films.length} titles</span></div>
    ${bio?`<p class="clip">${esc(bio)}</p><button class="vm">View more</button>`:''}</div></div>
    <h3>Other work</h3><div class="grid">${films.slice(0,40).map(f=>card({id:f.id,title:f.title,release_date:f.release_date,poster_path:f.poster_path})).join('')}</div>`);
  $('#sheet').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openMovie(+b.dataset.m));
  wireClips($('#sheet'));
  const setAw=h=>{if(actorTok===pid&&$('#aw .v'))$('#aw .v').innerHTML=h};
  const qid=p.external_ids?.wikidata_id;
  if(!qid){setAw('Not available');return}
  wd(qid).then(r=>{
    if(actorTok!==pid)return;
    if(r.home&&$('#lv')){$('#lv').hidden=false;$('#lv .v').textContent=r.home}
    setAw(awardsHTML(r.awards));
  }).catch(()=>setAw('Could not load awards'));
}

/* ---------- full-screen photos ---------- */
const lb=document.createElement('div');lb.id='lb';lb.hidden=true;
lb.innerHTML='<img alt=""><button class="lbx" aria-label="Close">✕</button><button class="lbp l" aria-label="Previous photo">‹</button><button class="lbp r" aria-label="Next photo">›</button>';
document.body.appendChild(lb);
let LB={list:[],i:0};
function lbShow(){lb.querySelector('img').src=LB.list[LB.i];lb.querySelectorAll('.lbp').forEach(b=>b.hidden=LB.list.length<2)}
function lbStep(d){const j=LB.i+d;if(j<0||j>=LB.list.length)return;LB.i=j;lbShow()}
lb.onclick=e=>{const c=e.target.classList;if(c.contains('lbp'))lbStep(c.contains('r')?1:-1);else lb.hidden=true};
document.addEventListener('click',e=>{
  const i=e.target.closest('img.zm');if(!i)return;
  const grp=[...(i.closest('.strip')||i.parentElement).querySelectorAll('img.zm')];

/* ---------- swipe to browse the next / previous title or actor ---------- */
let NAV=null;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-m],[data-a]');if(!el)return;
  const k=el.dataset.m!==undefined?'m':'a';
  const box=el.closest('.grid,.lb,.cast,.hero')||document;
  const ids=[...box.querySelectorAll(`[data-${k}]`)].map(x=>+x.dataset[k]);
  NAV={k,ids,i:ids.indexOf(+el.dataset[k])};
},true);
function navStep(d){
  if(!NAV)return;const j=NAV.i+d;if(j<0||j>=NAV.ids.length)return;
  NAV.i=j;$('#modal').scrollTop=0;
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)$('#sheet').animate([{transform:`translateX(${d*48}px)`,opacity:.2},{transform:'none',opacity:1}],{duration:220,easing:'ease-out'});
  NAV.k==='m'?openMovie(NAV.ids[j]):openActor(NAV.ids[j]);
}
function onSwipe(el,cb,skip){
  let x,y,ok;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];x=t.clientX;y=t.clientY;ok=!(skip&&e.target.closest(skip))},{passive:true});
  el.addEventListener('touchend',e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-x,dy=t.clientY-y;if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))cb(dx<0?1:-1)},{passive:true});
}
onSwipe($('#modal'),navStep,'.strip,.cast');
onSwipe(lb,lbStep,null);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;
  if(!lb.hidden)lbStep(d);else if($('#modal').classList.contains('open'))navStep(d);
});

/* ---------- boot ---------- */
async function boot(){
  try{all=await dbAll()}catch(e){all=load('lib')||[];$('#main').innerHTML=`<div class="msg">${esc(e.message)}</div>`}
}
boot().then(()=>{split();view='dashboard';render()});
